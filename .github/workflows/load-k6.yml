name: Load test (k6)

# Read-endpoint load test (AP6) - k6 twin of load-jmeter.yml. Manual only.
#   selfcontained (default): build a fresh Moodle + STACK Math Game siblings, seed and load-test here.
#   external: point at a Moodle you already run and seeded (enter base_url + courseid).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'selfcontained (build+seed here) or external (your own site)'
        type: choice
        options: [selfcontained, external]
        default: selfcontained
        required: true
      base_url:
        description: '[external mode] Base URL of your seeded Moodle'
        required: false
      courseid:
        description: '[external mode] Course id of a STACK Math Game course offering anonymous entry'
        required: false
      vus:
        description: Concurrent virtual users
        default: '25'
        required: false
      duration:
        description: Plateau duration seconds
        default: '90'
        required: false

jobs:
  k6:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=5

    env:
      MOODLE_BRANCH: MOODLE_405_STABLE
      MOODLE_WWWROOT: http://127.0.0.1:8000

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: Set up PHP
        if: ${{ github.event.inputs.mode == 'selfcontained' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pgsql, gd, intl, zip, soap, mbstring, curl, xml, exif
          ini-values: max_input_vars=5000
      - name: Install Maxima and gnuplot
        run: |
          # qtype_stack runs a live CAS healthcheck from its install.php. Without a maxima binary
          # install_database.php aborts and the site never comes up.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends maxima maxima-share gnuplot-nox

      - name: Build, install and seed a self-contained site
        id: selfcontained
        if: ${{ github.event.inputs.mode == 'selfcontained' }}
        run: |
          git clone --depth 1 --branch "$MOODLE_BRANCH" \
            https://github.com/moodle/moodle.git moodle
          mkdir -p moodle/local && cp -a plugin moodle/local/stackmathgame
          rm -rf moodle/local/stackmathgame/.git
          # local_stackmathgame has hard version.php dependencies, so the site cannot install
          # with the local plugin alone. Pin DEP_REF for a reproducible RC build.
          DEP_REF="${SIBLING_REF:-}"
          clone_dep() {
            repo="$1"; dest="$2"; defbranch="$3"
            ref="${DEP_REF:-$defbranch}"
            git clone --depth 1 --branch "$ref" "https://github.com/${repo}.git" /tmp/dep \
              || git clone --depth 1 --branch "$defbranch" "https://github.com/${repo}.git" /tmp/dep
            mkdir -p "$(dirname "moodle/${dest}")"
            cp -a /tmp/dep "moodle/${dest}"
            rm -rf "moodle/${dest}/.git" /tmp/dep
          }
          # qtype_stack declares FOUR dependencies, not one. Missing any of them aborts the
          # install with "Dependencies check failed for qtype_stack" - which reads like a problem
          # with STACK rather than an incomplete dependency list.
          clone_dep maths/moodle-qtype_stack                    question/type/stack            master
          clone_dep maths/moodle-qbehaviour_adaptivemultipart   question/behaviour/adaptivemultipart master
          clone_dep maths/moodle-qbehaviour_dfexplicitvaildate    question/behaviour/dfexplicitvaildate master
          clone_dep maths/moodle-qbehaviour_dfcbmexplicitvaildate question/behaviour/dfcbmexplicitvaildate master
          clone_dep maths/moodle-qbank_importasversion            question/bank/importasversion  main
          clone_dep ralferlebach/moodle-qbehaviour_stackmathgame question/behaviour/stackmathgame main
          clone_dep branchup/moodle-filter_shortcodes           filter/shortcodes              master
          mkdir -p /tmp/moodledata
          cd moodle
          php admin/cli/install.php \
            --non-interactive --agree-license \
            --dbtype=pgsql --dbhost=127.0.0.1 --dbport=5432 --dbname=moodle \
            --dbuser=moodle --dbpass=moodle \
            --wwwroot="$MOODLE_WWWROOT" --dataroot=/tmp/moodledata \
            --fullname="CI" --shortname="CI" \
            --adminpass="Admin!23" --adminemail=ci@example.invalid

          # A fresh qtype_stack install times the CAS out after 10 seconds; a cold Maxima on a
          # runner needs longer, and STACK then renders "CAS failed to return any data due to
          # timeout" instead of the question. The first call is also the slowest because Maxima
          # compiles STACK's library on it, so warm it here rather than mid-run.
          php admin/cli/cfg.php --component=qtype_stack --name=platform --set=linux
          php admin/cli/cfg.php --component=qtype_stack --name=maximacommand --set="$(command -v maxima)"
          php admin/cli/cfg.php --component=qtype_stack --name=castimeout --set=60
          php question/type/stack/cli/stacklibrarycheck.php || true
          php question/type/stack/cli/maximalibcheck.php || true
          # No web server is started here: seeding below is a CLI script and does not need one,
          # and a background server does not reliably survive beyond the step that started it.
          # Every step that needs HTTP starts and awaits its own server.
          # seed_large.php prints "export KEY='value'" lines (BASE_URL, COURSEID, INSTANCEID);
          # expose the ones the load plan needs as step outputs.
          php local/stackmathgame/tests/load/seed_large.php > /tmp/seed.env
          get() { sed -n "s/^export $1='\(.*\)'$/\1/p" /tmp/seed.env; }
          {
            echo "base_url=$(get BASE_URL)"
            echo "courseid=$(get COURSEID)"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve run parameters
        id: params
        run: |
          if [ "${{ github.event.inputs.mode }}" = "external" ]; then
            echo "base_url=${{ github.event.inputs.base_url }}" >> "$GITHUB_OUTPUT"
            echo "courseid=${{ github.event.inputs.courseid }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=${{ steps.selfcontained.outputs.base_url }}" >> "$GITHUB_OUTPUT"
            echo "courseid=${{ steps.selfcontained.outputs.courseid }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up k6
        uses: grafana/setup-k6-action@v1
      - name: Run load plan
        run: |
          # Serve with multiple workers so parallel requests don't serialise. Started inside THIS
          # step so it is guaranteed to be alive for the whole run.
          #
          # Bound to 127.0.0.1 rather than "localhost": PHP's built-in server listens on a
          # single address, while clients resolve "localhost" differently - curl reached the
          # server while k6 tried ::1 and reported connection errors as HTTP 0.
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8000 -t moodle >/tmp/moodle-server.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              http://127.0.0.1:8000/login/index.php || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "Der Moodle-Testserver ist nicht erreichbar geworden (letzter HTTP-Status: $code)."
            cat /tmp/moodle-server.log || true
            exit 1
          fi
          # Pre-flight: confirm the target answers before generating load. A dead server otherwise
          # surfaces as "100% of requests failed" and looks like a plugin problem.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "${{ steps.params.outputs.base_url }}/login/index.php" || true)
          if [ "$code" != "200" ]; then
            echo "Ziel ist nicht erreichbar (HTTP $code): ${{ steps.params.outputs.base_url }}"
            cat /tmp/moodle-server.log || true
            exit 1
          fi
          k6 run \
            -e BASE_URL='${{ steps.params.outputs.base_url }}' \
            -e COURSEID='${{ steps.params.outputs.courseid }}' \
            -e VUS='${{ github.event.inputs.vus }}' \
            -e DURATION='${{ github.event.inputs.duration }}s' \
            --summary-export=k6-summary.json \
            plugin/tests/load/stackmathgame-read-endpoints.js
      - name: Seed a capacity fixture and run the capacity race
        run: |
          # A read-load run cannot show whether the capacity limit actually holds under real
          # concurrency; only genuinely parallel writes can. The fixture leaves exactly FREE_SEATS
          # open, so the expected outcome is unambiguous.
          cd moodle
          FREE_SEATS=1 CAPACITY=20 php local/stackmathgame/tests/load/seed_capacity.php > /tmp/cap.env
          cd ..
          get() { sed -n "s/^export $1='\(.*\)'$/\1/p" /tmp/cap.env; }
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8000 -t moodle >/tmp/moodle-server.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              http://127.0.0.1:8000/login/index.php || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "Der Moodle-Testserver ist nicht erreichbar geworden (letzter HTTP-Status: $code)."
            cat /tmp/moodle-server.log || true
            exit 1
          fi
          k6 run \
            -e BASE_URL="$(get BASE_URL)" \
            -e COURSEID="$(get COURSEID)" \
            -e FREE_SEATS="$(get FREE_SEATS)" \
            -e VUS=30 \
            --summary-export=k6-capacity-summary.json \
            plugin/tests/load/stackmathgame-capacity-race.js

      - name: Show Moodle server log on failure
        if: failure() && github.event.inputs.mode == 'selfcontained'
        run: tail -100 /tmp/moodle-server.log || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: |
            k6-summary.json
            k6-capacity-summary.json
          retention-days: 7
          if-no-files-found: ignore
