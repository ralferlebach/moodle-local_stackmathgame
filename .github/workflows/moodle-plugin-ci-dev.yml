##############################################################################
# Moodle Plugin CI - development (accelerated) pipeline - local_stackmathgame
#
# Runs on push / PR to every branch EXCEPT main. Parallel jobs: phplint gates
# phpunit; codeanalysis (phpcs blocking; phpmd/phpcpd advisory) and quality
# (phpdoc/savepoints/validate) run in parallel and gate ci-complete. PHP-only
# plugin ships AMD modules, so grunt and mustache run here too. Reduced matrix
# spanning Moodle 4.5/5.0/5.2 with PHP 8.2-8.4.
# The full sequential matrix runs on main via moodle-plugin-ci-main.yml.
#
# STACK Math Game has hard plugin dependencies (see version.php); add-plugin pulls the
# sibling plugins required by this component's hard dependency graph.
##############################################################################

name: Moodle Plugin CI Dev

on:
  push:
    branches-ignore:
      - main
    tags:
      - '[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches-ignore:
      - main

concurrency:
  group: ci-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  lint-php:
    name: "PHP lint (phplint)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Prepare log directory
        run: mkdir -p ci-logs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
      - name: PHP Lint
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phplint plugin 2>&1 | tee ci-logs/phplint.log
      - name: Collect error summary
        if: ${{ always() }}
        run: |
          { echo "job: lint-php"; echo "status: ${{ job.status }}"; echo "ref: ${{ github.ref }}"; echo ""; ls -1 ci-logs; } > ci-logs/summary.txt
          cat ci-logs/summary.txt
      - name: Upload error summary (ZIP)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: error-summary-dev-lint-php
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  codeanalysis:
    name: "Code analysis (phpcs + phpmd + phpcpd)"
    runs-on: ubuntu-22.04
    services:
      # Needed by the lightweight Moodle install below: moodle-plugin-ci writes a config.php
      # with a database connection even when --no-init skips creating the test databases.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Prepare log directory
        run: mkdir -p ci-logs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle and the plugin (no test init)
        run: |
          # Needed only so the code checker runs inside a Moodle tree. Several sniffs -
          # moodle.PHPUnit.TestCaseNames and moodle.PHPUnit.TestCaseCovers among them - report
          # nothing at all on a standalone directory, so a run without this is green for reasons
          # that say nothing about the code. --no-init keeps it cheap: no test databases.
          moodle-plugin-ci add-plugin --branch master maths/moodle-qtype_stack
          moodle-plugin-ci add-plugin --branch master maths/moodle-qbehaviour_adaptivemultipart
          moodle-plugin-ci add-plugin --branch main ralferlebach/moodle-qbehaviour_stackmathgame
          moodle-plugin-ci add-plugin --branch master branchup/moodle-filter_shortcodes
          moodle-plugin-ci add-plugin --branch master FMCorz/moodle-block_xp
          moodle-plugin-ci add-plugin --branch master FMCorz/moodle-block_stash
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --no-init
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Moodle Code Checker
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci codechecker --max-warnings 0 --exclude=PSR1.Classes.ClassDeclaration,moodle.Commenting.TodoComment 2>&1 | tee ci-logs/codechecker.log
      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpmd 2>&1 | tee ci-logs/phpmd.log
      - name: PHP Copy/Paste Detector
        continue-on-error: true
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpcpd 2>&1 | tee ci-logs/phpcpd.log
      - name: Collect error summary
        if: ${{ always() }}
        run: |
          { echo "job: codeanalysis"; echo "status: ${{ job.status }}"; echo "ref: ${{ github.ref }}"; echo ""; ls -1 ci-logs; } > ci-logs/summary.txt
          cat ci-logs/summary.txt
      - name: Upload error summary (ZIP)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: error-summary-dev-codeanalysis
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  quality:
    name: "Quality (phpdoc / savepoints / validate)"
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Prepare log directory
        run: mkdir -p ci-logs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle, dependencies and plugin (no test init)
        run: |
          # Hard dependencies from version.php: qtype_stack, qbehaviour_stackmathgame,
          # filter_shortcodes. qbehaviour_adaptivemultipart is a hard dependency OF
          # qtype_stack -- without it the Moodle install aborts before our plugin is
          # ever reached. block_xp / block_stash are soft integrations; they are
          # installed so the optional bridges are exercised rather than skipped.
          # qbehaviour_stackmathgame is pinned to main even on the development pipeline:
          # that repository has no development branch, and add-plugin fails hard on a
          # missing ref rather than falling back to the default one.
          moodle-plugin-ci add-plugin --branch master maths/moodle-qtype_stack
          moodle-plugin-ci add-plugin --branch master maths/moodle-qbehaviour_adaptivemultipart
          moodle-plugin-ci add-plugin --branch main ralferlebach/moodle-qbehaviour_stackmathgame
          moodle-plugin-ci add-plugin --branch master branchup/moodle-filter_shortcodes
          moodle-plugin-ci add-plugin --branch master FMCorz/moodle-block_xp
          moodle-plugin-ci add-plugin --branch master FMCorz/moodle-block_stash
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --no-init
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_405_STABLE
      - name: Moodle PHPDoc Checker
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpdoc --max-warnings 0 2>&1 | tee ci-logs/phpdoc.log
      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci savepoints 2>&1 | tee ci-logs/savepoints.log
      - name: Validating
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci validate 2>&1 | tee ci-logs/validate.log
      - name: Collect error summary
        if: ${{ always() }}
        run: |
          { echo "job: quality"; echo "status: ${{ job.status }}"; echo "ref: ${{ github.ref }}"; echo ""; ls -1 ci-logs; } > ci-logs/summary.txt
          cat ci-logs/summary.txt
      - name: Upload error summary (ZIP)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: error-summary-dev-quality
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  phpunit:
    name: "PHPUnit / ${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.database }}"
    runs-on: ubuntu-22.04
    needs: [lint-php]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        include:
          # One cell per supported Moodle release: the oldest at its lowest PHP, the newest at
          # its highest, so a break at either end of the supported range shows up on the
          # development branch rather than first on main.
          - { moodle: MOODLE_405_STABLE, php: '8.2', database: pgsql }
          - { moodle: MOODLE_500_STABLE, php: '8.3', database: mariadb }
          - { moodle: MOODLE_502_STABLE, php: '8.4', database: pgsql }
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Prepare log directory
        run: mkdir -p ci-logs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
      - name: Install Maxima and gnuplot
        run: |
          # qtype_stack's install.php runs a live CAS healthcheck while the site is being
          # installed. Without a maxima binary it throws a coding exception, install_database.php
          # aborts, and moodle-plugin-ci never gets to write MOODLE_DIR into the job environment.
          # Every later step then resolves the Moodle root to the workspace and fails with a
          # message about something else entirely: "Unable to find Gruntfile",
          # "Could not load core_component", "vendor/bin/phpunit: not found".
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends maxima maxima-share gnuplot-nox
          maxima --version

      - name: Install Moodle, dependencies and plugin
        run: |
          # Hard dependencies from version.php: qtype_stack, qbehaviour_stackmathgame,
          # filter_shortcodes. qbehaviour_adaptivemultipart is a hard dependency OF
          # qtype_stack -- without it the Moodle install aborts before our plugin is
          # ever reached. block_xp / block_stash are soft integrations; they are
          # installed so the optional bridges are exercised rather than skipped.
          # qbehaviour_stackmathgame is pinned to main even on the development pipeline:
          # that repository has no development branch, and add-plugin fails hard on a
          # missing ref rather than falling back to the default one.
          moodle-plugin-ci add-plugin --branch master maths/moodle-qtype_stack
          moodle-plugin-ci add-plugin --branch master maths/moodle-qbehaviour_adaptivemultipart
          moodle-plugin-ci add-plugin --branch main ralferlebach/moodle-qbehaviour_stackmathgame
          moodle-plugin-ci add-plugin --branch master branchup/moodle-filter_shortcodes
          moodle-plugin-ci add-plugin --branch master FMCorz/moodle-block_xp
          moodle-plugin-ci add-plugin --branch master FMCorz/moodle-block_stash
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
      - name: Mustache Lint
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci mustache 2>&1 | tee ci-logs/mustache.log
      - name: Grunt (AMD build + ESLint)
        if: ${{ always() }}
        # local_stackmathgame ships AMD modules in amd/src/ AND in every mode subplugin
        # (mode/*/amd/src/). --max-lint-warnings 0 keeps ESLint warnings failing, which is
        # what caught the undocumented @returns in the mode modules.
        run: set -o pipefail; moodle-plugin-ci grunt --max-lint-warnings 0 2>&1 | tee ci-logs/grunt.log
      - name: Grunt for the bundled mode subplugins (AMD build + ESLint)
        if: ${{ always() }}
        run: |
          # Grunt resolves the component from the directory it runs in, so the step above only
          # ever touches local_stackmathgame's own amd/src. The three game modes under mode/ are
          # separate Moodle components with their own amd/src and amd/build, and until this step
          # existed nothing in CI linted or rebuilt them: a run stayed green with a deliberately
          # broken mode/rpg/amd/src/game.js, and a stale mode/*/amd/build/game.min.js shipped an
          # old game module while the source next to it looked current.
          set -o pipefail
          # PLUGIN_DIR is written into moodle-plugin-ci's own ci/.env, not into $GITHUB_ENV, so
          # it is NOT a shell variable here - referencing it directly yields an empty string.
          # Read it back from that file instead.
          plugindir=$(sed -n 's/^PLUGIN_DIR=//p' ci/.env)
          if [ -z "$plugindir" ]; then
            echo "PLUGIN_DIR not found in ci/.env - did the install step run?" >&2
            exit 1
          fi
          status=0
          for mode in "$plugindir"/mode/*/; do
            [ -d "${mode}amd/src" ] || continue
            echo "==> $(basename "$mode")"
            moodle-plugin-ci grunt "$mode" --max-lint-warnings 0 2>&1 \
              | tee -a ci-logs/grunt-modes.log || status=1
          done
          exit $status

      - name: Jest (AMD unit tests)
        if: ${{ always() }}
        run: |
          set -o pipefail
          cd plugin/tests/jest
          npm install --no-audit --no-fund
          npx jest 2>&1 | tee ../../../ci-logs/jest.log
      - name: PHPUnit tests
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpunit --fail-on-warning --testdox 2>&1 | tee ci-logs/phpunit.log
      - name: Collect error summary
        if: ${{ always() }}
        run: |
          { echo "job: phpunit (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.database }})"; echo "status: ${{ job.status }}"; echo "ref: ${{ github.ref }}"; echo ""; ls -1 ci-logs; } > ci-logs/summary.txt
          cat ci-logs/summary.txt
      - name: Upload error summary (ZIP)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: error-summary-dev-phpunit-${{ matrix.moodle }}-${{ matrix.php }}-${{ matrix.database }}
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  behat:
    name: "Behat / MOODLE_405_STABLE / PHP 8.2 / Chrome"
    runs-on: ubuntu-22.04
    needs: [lint-php]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Prepare log directory
        run: mkdir -p ci-logs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          ini-values: max_input_vars=5000
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
      - name: Install Maxima and gnuplot
        run: |
          # qtype_stack's install.php runs a live CAS healthcheck while the site is being
          # installed. Without a maxima binary it throws a coding exception, install_database.php
          # aborts, and moodle-plugin-ci never gets to write MOODLE_DIR into the job environment.
          # Every later step then resolves the Moodle root to the workspace and fails with a
          # message about something else entirely: "Unable to find Gruntfile",
          # "Could not load core_component", "vendor/bin/phpunit: not found".
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends maxima maxima-share gnuplot-nox
          maxima --version

      - name: Install Moodle, dependencies and plugin
        run: |
          # Hard dependencies from version.php: qtype_stack, qbehaviour_stackmathgame,
          # filter_shortcodes. qbehaviour_adaptivemultipart is a hard dependency OF
          # qtype_stack -- without it the Moodle install aborts before our plugin is
          # ever reached. block_xp / block_stash are soft integrations; they are
          # installed so the optional bridges are exercised rather than skipped.
          # qbehaviour_stackmathgame is pinned to main even on the development pipeline:
          # that repository has no development branch, and add-plugin fails hard on a
          # missing ref rather than falling back to the default one.
          moodle-plugin-ci add-plugin --branch master maths/moodle-qtype_stack
          moodle-plugin-ci add-plugin --branch master maths/moodle-qbehaviour_adaptivemultipart
          moodle-plugin-ci add-plugin --branch main ralferlebach/moodle-qbehaviour_stackmathgame
          moodle-plugin-ci add-plugin --branch master branchup/moodle-filter_shortcodes
          moodle-plugin-ci add-plugin --branch master FMCorz/moodle-block_xp
          moodle-plugin-ci add-plugin --branch master FMCorz/moodle-block_stash
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_405_STABLE
      - name: Behat features
        id: behat
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci behat --profile chrome --tags "@local_stackmathgame&&~@broken" --dump 2>&1 | tee ci-logs/behat.log
      - name: Collect error summary and Behat dumps
        if: ${{ always() }}
        run: |
          if [ -d "$GITHUB_WORKSPACE/moodledata/behat_dump" ]; then
            mkdir -p ci-logs/behat_dump
            cp -a "$GITHUB_WORKSPACE/moodledata/behat_dump/." ci-logs/behat_dump/
          fi
          { echo "job: behat"; echo "status: ${{ job.status }}"; echo "ref: ${{ github.ref }}"; echo ""; ls -1 ci-logs; } > ci-logs/summary.txt
          cat ci-logs/summary.txt
      - name: Upload error summary (ZIP)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: error-summary-dev-behat
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload Behat screenshots (ZIP)
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: behat-screenshots-dev
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: warn

  stale-files:
    name: Stale files
    runs-on: ubuntu-22.04
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Files removed in earlier releases must not still be present
        run: |
          # Unpacking a plugin ZIP adds and overwrites files but never deletes any, so a file
          # removed upstream survives in an installed copy or in a repository updated that way.
          # It then still autoloads, duplicates a class, or reads columns that no longer exist.
          # This job turns that into a loud failure instead of confusing downstream errors.
          list=db/removed_files.txt
          if [[ ! -f "$list" ]]; then
            echo "Keine Liste entfernter Dateien vorhanden - nichts zu pruefen."
            exit 0
          fi
          rc=0
          while IFS= read -r path; do
            [[ -z "$path" || "$path" == \#* ]] && continue
            if [[ -e "$path" ]]; then
              echo "Veraltete Datei ist noch vorhanden: $path"
              rc=1
            fi
          done < "$list"
          if [[ $rc -ne 0 ]]; then
            echo "Diese Dateien wurden in frueheren Releases entfernt und muessen geloescht werden."
            exit 1
          fi
          echo "Keine veralteten Dateien gefunden."

  ci-complete:
    name: CI complete
    needs: [lint-php, codeanalysis, quality, phpunit, behat, stale-files]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: All dev jobs must have succeeded
        run: |
          result="${{ needs.lint-php.result }}-${{ needs.codeanalysis.result }}-${{ needs.quality.result }}-${{ needs.phpunit.result }}-${{ needs.behat.result }}-${{ needs.stale-files.result }}"
          if [[ "$result" == "success-success-success-success-success-success" ]]; then
            echo "All dev CI jobs passed."
          else
            echo "CI result: $result - one or more jobs failed or were cancelled."
            exit 1
          fi
